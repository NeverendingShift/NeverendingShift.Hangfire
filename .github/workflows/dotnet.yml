# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
      
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ./src
        
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: NuGet Login
      id: login
      uses: NuGet/login@v1
      with:
        # NuGet username
        user: dbarwikowski
        # Token exchange endpoint URL
        token-service-url: # optional, default is https://www.nuget.org/api/v2/token
        # OIDC audience to request
        audience: # optional, default is https://www.nuget.org
    - name: Push nuget
      uses: Jacup/publish-nuget@v2.6.0
      with:
        # Filepath of the project to be packaged, relative to root of repository
        PROJECT_FILE_PATH: ./NeverendingShift.Hangfire/NeverendingShift.Hangfire.csproj
        # NuGet package id, used for version detection & defaults to project name
        PACKAGE_NAME: # optional
        # Filepath with version info, relative to root of repository & defaults to PROJECT_FILE_PATH
        VERSION_FILE_PATH: # optional
        # Regex pattern to extract version info in a capturing group
        VERSION_REGEX: # optional, default is ^\s*<Version>(.*)<\/Version>\s*$
        # Useful with external providers like Nerdbank.GitVersioning, ignores VERSION_FILE_PATH & VERSION_REGEX
        VERSION_STATIC: # optional
        # Flag to toggle git tagging, enabled by default
        TAG_COMMIT: # optional, default is true
        # Format of the git tag, [*] gets replaced with actual version
        TAG_FORMAT: # optional, default is v*
        # API key to authenticate with NuGet server
        NUGET_KEY: "${{ steps.login.outputs.NUGET_API_KEY }}"
        # NuGet server uri hosting the packages, defaults to https://api.nuget.org
        NUGET_SOURCE: # optional, default is https://api.nuget.org
              
